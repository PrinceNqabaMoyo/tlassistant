# Fundile 5-Tier Anti-Erosion Governance Pipeline
repos:
  - repo: local
    hooks:
      - id: ast-purity-linter
        name: AST Generator Purity Linter (Zero-LLM Enforcer)
        entry: python caps-ai-backend/scripts/lint_purity.py
        language: system
        types: [python]
        files: ^caps-ai-backend/(app/utils|generators)/.*\.py$
        pass_filenames: false
